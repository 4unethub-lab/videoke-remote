<!DOCTYPE html>
<html>
<body>
    <h1>Videoke Remote</h1>
    <input type="text" id="songUrl" placeholder="Enter YouTube URL">
    <button onclick="addSong()">Add to Queue</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://forunethub-videokepro-default-rtdb.firebaseio.com/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.addSong = function() {
            const url = document.getElementById('songUrl').value;
            // Mag-a-add ng kanta sa loob ng VID-9982 room
            push(ref(db, 'rooms/VID-9982/queue'), {
                url: url,
                status: 'pending'
            });
            alert("Kanta na-add na sa queue!");
        }
    </script>
</body>
</html>
