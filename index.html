<!DOCTYPE html>
<html>
<body>
    <h1>Videoke Remote</h1>
    <input type="text" id="urlInput" placeholder="Enter YouTube URL">
    <button onclick="addToQueue()">Add to Queue</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://forunethub-videokepro-default-rtdb.firebaseio.com/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.addToQueue = function() {
            const url = document.getElementById("urlInput").value;
            if (url) {
                const newSongRef = push(ref(db, 'rooms/VID-9982/queue'));
                set(newSongRef, {
                    url: url,
                    status: 'pending'
                });
                alert("Kanta added to queue!");
                document.getElementById("urlInput").value = "";
            }
        };
    </script>
</body>
</html>
