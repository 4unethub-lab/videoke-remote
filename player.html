<!DOCTYPE html>
<html>
<body>
    <div id="player-container"></div>
    <h2 id="songTitle">Videoke Player</h2>
    <button onclick="nextSong()">NEXT SONG</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://forunethub-videokepro-default-rtdb.firebaseio.com/" }));
        let currentQueue = [];

        // Nakikinig sa changes sa database
        onValue(ref(db, 'rooms/VID-9982/queue'), (snapshot) => {
            currentQueue = [];
            snapshot.forEach((child) => {
                if (child.val().status === 'pending') {
                    currentQueue.push({ id: child.key, url: child.val().url });
                }
            });
            console.log("Bagong kanta sa pila:", currentQueue.length);
        });

        window.nextSong = function() {
            if (currentQueue.length > 0) {
                const song = currentQueue[0];
                const videoId = song.url.split('v=')[1].split('&')[0]; // Safe way to get ID
                
                // I-load ang video sa loob ng page
                document.getElementById('player-container').innerHTML = 
                    `<iframe width="640" height="360" src="https://www.youtube.com/embed/${videoId}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
                
                // I-update sa Firebase na played na
                update(ref(db, `rooms/VID-9982/queue/${song.id}`), { status: 'played' });
                
                document.getElementById('songTitle').innerText = "Playing: " + song.url;
            } else {
                alert("Wala nang kanta sa pila!");
            }
        };
    </script>
</body>
</html>
